<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viorah Situation Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060B18;
      --card: #0D1526;
      --teal: #00E5C3;
      --teal-dim: rgba(0,229,195,0.10);
      --teal-border: rgba(0,229,195,0.20);
      --white: #FFFFFF;
      --grey: rgba(255,255,255,0.45);
      --border: rgba(255,255,255,0.05);
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
      background-image:
        linear-gradient(rgba(0,229,195,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,195,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .orb {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      position: relative;
    }
    .orb svg { width: 64px; height: 64px; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.94)} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    .orb { animation: float 3s ease-in-out infinite; }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--white);
    }
    .brand-name span { color: var(--teal); }
    .brand-sub {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--grey);
      margin-top: 6px;
    }
    .tagline {
      font-size: 14px;
      color: var(--grey);
      margin-top: 12px;
      max-width: 280px;
      line-height: 1.6;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
    }
    .auth-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 13px;
      color: var(--grey);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .loading {
      text-align: center;
      padding: 40px 0;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--teal);
      letter-spacing: 0.08em;
    }
    .loading-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      margin: 0 3px;
      animation: pulse 1s ease-in-out infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    .meridian-note {
      margin-top: 20px;
      background: var(--teal-dim);
      border: 1px solid var(--teal-border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--grey);
      line-height: 1.5;
    }
    .meridian-note strong {
      color: var(--teal);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      font-family: 'DM Mono', monospace;
    }
    #clerk-auth .cl-card { background: transparent !important; box-shadow: none !important; }
    #clerk-auth .cl-headerTitle { color: var(--white) !important; font-family: 'Syne', sans-serif !important; }
    #clerk-auth .cl-headerSubtitle { color: var(--grey) !important; }
    #clerk-auth .cl-formFieldInput {
      background: rgba(255,255,255,0.04) !important;
      border: 1px solid var(--border) !important;
      color: var(--white) !important;
      border-radius: 8px !important;
    }
    #clerk-auth .cl-formButtonPrimary {
      background: var(--teal) !important;
      color: #060B18 !important;
      font-family: 'Syne', sans-serif !important;
      font-weight: 700 !important;
      border-radius: 8px !important;
    }
  </style>
</head>
<body>

  <div class="brand">
    <div class="orb">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="29" fill="none" stroke="#00E5C3" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="4 8" style="animation: spin 12s linear infinite; transform-origin: 32px 32px;" />
        <circle cx="32" cy="32" r="20" fill="rgba(0,229,195,0.08)" />
        <polygon points="32,12 50,42 14,42" fill="none" stroke="#00E5C3" stroke-width="0.8" stroke-opacity="0.6" />
        <circle cx="24" cy="28" r="3" fill="#00E5C3" style="animation: pulse 2s ease-in-out infinite;" />
        <circle cx="40" cy="28" r="3" fill="#00E5C3" style="animation: pulse 2s ease-in-out 0.3s infinite;" />
        <line x1="22" y1="37" x2="42" y2="37" stroke="#00E5C3" stroke-width="1" stroke-opacity="0.5" />
      </svg>
    </div>
    <div class="brand-name">Vi<span>R</span>orah</div>
    <div class="brand-sub">Situation Room</div>
    <div class="tagline">Walk into any room ready for anything.</div>
  </div>

  <div class="auth-card">
    <div id="loading" class="loading">
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </div>
    <div id="clerk-auth" style="display:none;"></div>
    <div id="signed-in" style="display:none; text-align:center; padding: 20px 0;">
      <div style="font-family:'DM Mono',monospace; font-size:12px; color:var(--teal); letter-spacing:0.08em;">REDIRECTING</div>
    </div>
    <div class="meridian-note">
      <strong>MERIDIAN Active</strong>
      Every tool is calibrated to your exact professional reality. Not generic advice. Your advice.
    </div>
  </div>

  <div class="footer">Viorah Pvt Ltd &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; 2026</div>

  <script>
    const CLERK_KEY = pk_test_YnJpZWYta29pLTc2LmNsZXJrLmFjY291bnRzLmRldiQ;
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js';
    script.setAttribute('data-clerk-publishable-key', CLERK_KEY);
    script.async = true;
    script.onload = async () => {
      try {
        await window.Clerk.load();
        document.getElementById('loading').style.display = 'none';
        if (window.Clerk.user) {
          document.getElementById('signed-in').style.display = 'block';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
        } else {
          document.getElementById('clerk-auth').style.display = 'block';
          window.Clerk.mountSignIn(document.getElementById('clerk-auth'), {
            afterSignInUrl: 'dashboard.html',
            afterSignUpUrl: 'onboarding.html',
          });
        }
      } catch(e) {
        document.getElementById('loading').innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:12px;">Configure Clerk key to enable auth.</div>';
      }
    };
    document.head.appendChild(script);
  </script>

</body>
</html>
